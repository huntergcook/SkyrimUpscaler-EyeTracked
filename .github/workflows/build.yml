name: Build (Skyrim VR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Update vcpkg
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          git fetch --unshallow 2>$null; git pull --quiet
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          $flags = "/EHsc /MP /W3 /wd4100 /wd4189 /wd4244 /wd4267 /wd4305 /wd4456 /wd4458 /wd4459 /wd4701 /wd4702 /wd4996 /wd5054"
          cmake -S . --preset=skyrim "-DCMAKE_CXX_FLAGS=$flags" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SKSE/Plugins | Out-Null
          Get-ChildItem -Recurse build -Include SkyrimUpscaler.dll,SkyrimUpscaler.pdb | Where-Object { $_.FullName -match 'Release' } | Copy-Item -Destination dist/SKSE/Plugins
          Get-ChildItem dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimUpscaler-EyeTracked
          path: dist

      # Publish the build log (and the DLL when the build succeeds) to the ci-output branch so they
      # can be read with plain git, without the Actions log/artifact storage.
      - name: Publish log and output to ci-output branch
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ci-output"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($f in @("configure.log", "build.log")) { if (Test-Path $f) { Copy-Item $f $out } }
          if (Test-Path dist) { Copy-Item -Recurse dist (Join-Path $out "dist") }
          "commit: $env:GITHUB_SHA`nrun: $env:GITHUB_RUN_ID`nstatus: ${{ job.status }}" | Set-Content (Join-Path $out "STATUS.txt")
          Set-Location $out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-output
          git add -A
          git commit -q -m "CI output for $env:GITHUB_SHA ($env:GITHUB_RUN_ID)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output
