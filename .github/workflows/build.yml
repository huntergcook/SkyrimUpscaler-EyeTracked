name: Build (Skyrim VR)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Update vcpkg
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          git fetch --unshallow 2>$null; git pull --quiet
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        env:
          CXXFLAGS: /wd4100 /wd4189 /wd4244 /wd4267 /wd4305 /wd4456 /wd4458 /wd4459 /wd4701 /wd4702 /wd4996 /wd5054
        run: cmake -S . --preset=skyrim -DCMAKE_CXX_FLAGS="/EHsc /MP /W3 $env:CXXFLAGS"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SKSE/Plugins | Out-Null
          Get-ChildItem -Recurse build -Include SkyrimUpscaler.dll,SkyrimUpscaler.pdb | Where-Object { $_.FullName -match 'Release' } | Copy-Item -Destination dist/SKSE/Plugins
          Get-ChildItem dist -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimUpscaler-EyeTracked
          path: dist
